version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopos-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: shopos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shopos-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  redisdata:
